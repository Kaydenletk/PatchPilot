[project]
name = "selfheal"
version = "0.1.0"
description = "Self-healing code agent: AST analysis + Docker sandbox + LLM patch loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1",
    "openai>=1.99",
    "pydantic>=2.8",
    "rich>=13.7",
    "streamlit>=1.40",
]

[project.scripts]
selfheal = "selfheal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfheal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]
addopts = "-q"

[tool.coverage.run]
source = ["selfheal"]
omit = ["src/selfheal/cli.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scenarios"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
